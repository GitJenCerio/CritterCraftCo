<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop for personalized souvenirs, custom keychains, magnets, and more at Critter Craft Co">
    <title>Shop - Critter Craft Co.</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lily+Script+One&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Shop Page Content -->
    <main class="shop-page container py-5">
        <h1 class="text-center mb-5">Our Products</h1>
        <div class="row g-4" id="product-list">
            <!-- Products will be dynamically loaded here -->
            <div class="col-12 text-center">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading products...</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Product Details Modal -->
    <div id="product-details-modal" class="modal fade" tabindex="-1" aria-labelledby="product-details-title" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 id="product-details-title" class="modal-title">Product Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="position-relative d-flex align-items-center justify-content-center mb-3">
                        <!-- Left Arrow -->
                        <button class="btn btn-light position-absolute start-0 image-nav-btn" data-direction="left" style="z-index: 2;" aria-label="Previous image">&#9664;</button>
                        
                        <!-- Main Image -->
                        <img src="" alt="Main Product Image" class="main-product-image img-fluid rounded" style="max-width: 100%; height: auto;">
                        
                        <!-- Right Arrow -->
                        <button class="btn btn-light position-absolute end-0 image-nav-btn" data-direction="right" style="z-index: 2;" aria-label="Next image">&#9654;</button>
                    </div>
                    <!-- Thumbnails Section -->
                    <div class="thumbnail-container d-flex justify-content-center gap-2 mb-3">
                        <!-- Thumbnails will be dynamically added here -->
                    </div>
                    <!-- Product Details -->
                    <p class="product-price fs-4 fw-bold mt-3"></p>
                    <p class="product-description"></p>
                    <!-- Add to Cart Button -->
                    <button class="btn btn-warning add-to-cart-modal-btn mt-3 w-100">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Component Loader and Main Script -->
    <script type="module">
        import { loadHeader, loadFooter } from '../js/utils/componentLoader.js';
        import '../js/main.js';
        
        loadHeader();
        loadFooter();
    </script>
</body>
</html>
