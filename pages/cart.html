<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your shopping cart at Critter Craft Co">
    <title>Cart - Critter Craft Co.</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lily+Script+One&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Cart Page Content -->
    <main class="cart-page">
        <h1>Your Cart</h1>

        <!-- Cart Table -->
        <div class="cart-table">
            <!-- Cart items will be dynamically loaded here -->
            <div class="text-center py-5">
                <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Loading cart...</span>
                </div>
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
            <div class="estimated-total">
                <span>Estimated total</span>
                <span>₱0.00</span>
            </div>
            <p class="tax-note">Taxes, discount, and shipping calculated at checkout</p>
            <a href="checkout.html" class="checkout-btn-link">
                <button class="checkout-btn" type="button">Check out</button>
            </a>
        </div>
    </main>

    <!-- Cart Item Template (hidden) -->
    <template id="cart-item-template">
        <div class="cart-item">
            <div class="item-details">
                <img src="" alt="" class="item-image">
                <div>
                    <div class="product-name"></div>
                    <div class="product-price"></div>
                </div>
            </div>
            <div class="quantity-control">
                <input type="number" class="quantity" value="1" min="1" aria-label="Quantity">
            </div>
            <div class="total-price"></div>
            <button class="remove-btn" type="button" aria-label="Remove item">
                <img src="../public/images/icon-delete.png" alt="Delete" class="delete-icon">
            </button>
        </div>
    </template>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Component Loader and Main Script -->
    <script type="module">
        import { loadHeader, loadFooter } from '../js/utils/componentLoader.js';
        import '../js/main.js';
        
        loadHeader();
        loadFooter();
    </script>
</body>
</html>
