<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Critter Craft Co for inquiries and custom orders">
    <title>Contact Us - Critter Craft Co.</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lily+Script+One&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Contact Page Content -->
    <section class="page-section position-relative">
        <!-- Background Sections -->
        <div class="page-top-half"></div>
        <div class="page-bottom-half"></div>

        <!-- Contact Container -->
        <div class="container position-relative z-1 d-flex flex-column align-items-center text-center py-5">
            <div class="contact-container">
                <!-- Image Section -->
                <div class="contact-image" style="background-image: url('../public/images/contact-image.png');"></div>

                <!-- Contact Info Section -->
                <div class="contact-info">
                    <h1 class="display-5 fw-bold">Contact Us</h1>
                    <p>If you have any inquiries or concerns, please fill out the form below and we will get back to you as soon as possible.</p>

                    <!-- Form -->
                    <form id="contact-form" action="#" method="post" novalidate>
                        <label for="contact-email" class="form-label visually-hidden">Email</label>
                        <input type="email" id="contact-email" name="email" placeholder="Email" class="contact-input" required aria-required="true" aria-describedby="email-error">

                        <label for="contact-name" class="form-label visually-hidden">Name</label>
                        <input type="text" id="contact-name" name="name" placeholder="Name" class="contact-input" required aria-required="true" minlength="2" aria-describedby="name-error">

                        <label for="contact-phone" class="form-label visually-hidden">Contact Number</label>
                        <input type="tel" id="contact-phone" name="contact" placeholder="Contact No." class="contact-input" required aria-required="true" aria-describedby="phone-error">

                        <label for="contact-inquiry" class="form-label visually-hidden">Inquiry</label>
                        <textarea id="contact-inquiry" name="inquiry" placeholder="Inquiry" class="contact-input" rows="4" required aria-required="true" minlength="10" aria-describedby="inquiry-error"></textarea>

                        <button type="submit" class="contact-submit">Submit</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Component Loader and Main Script -->
    <script type="module">
        import { loadHeader, loadFooter } from '../js/utils/componentLoader.js';
        import '../js/main.js';
        
        loadHeader();
        loadFooter();
    </script>
</body>
</html>
