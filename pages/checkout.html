<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Checkout your order at Critter Craft Co">
    <title>Check Out - Critter Craft Co.</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lily+Script+One&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Checkout Page Content -->
    <main class="checkout-page">
        <h1>Check Out</h1>
        <div class="checkout-container">
            <!-- Customer Information Section -->
            <div class="checkout-info">
                <h2>Contact</h2>
                <label for="checkout-email" class="form-label visually-hidden">Email</label>
                <input type="email" id="checkout-email" placeholder="Email" class="checkout-input" required aria-required="true">

                <h2 class="mt-4">Payment</h2>
                <label for="checkout-payment" class="form-label visually-hidden">Payment Method</label>
                <select id="checkout-payment" class="checkout-input" required aria-required="true">
                    <option value="">Select payment method</option>
                    <option value="qr">QR / e-Wallets</option>
                    <option value="gcash">GCash</option>
                    <option value="maya">Maya</option>
                </select>

                <h2 class="mt-4">Billing Address</h2>
                <label for="checkout-country" class="form-label visually-hidden">Country</label>
                <select id="checkout-country" class="checkout-input" required aria-required="true">
                    <option value="">Select country</option>
                    <option value="ph">Philippines</option>
                </select>
                <div class="checkout-name">
                    <div>
                        <label for="checkout-firstname" class="form-label visually-hidden">First Name</label>
                        <input type="text" id="checkout-firstname" placeholder="First Name" class="checkout-input" required aria-required="true">
                    </div>
                    <div>
                        <label for="checkout-lastname" class="form-label visually-hidden">Last Name</label>
                        <input type="text" id="checkout-lastname" placeholder="Last Name" class="checkout-input" required aria-required="true">
                    </div>
                </div>
                <label for="checkout-address" class="form-label visually-hidden">Address</label>
                <input type="text" id="checkout-address" placeholder="Address" class="checkout-input" required aria-required="true">
                <label for="checkout-region" class="form-label visually-hidden">Region</label>
                <select id="checkout-region" class="checkout-input" required aria-required="true">
                    <option value="">Select region</option>
                    <option value="ncr">National Capital Region</option>
                    <option value="luzon">Luzon</option>
                    <option value="visayas">Visayas</option>
                    <option value="mindanao">Mindanao</option>
                </select>
            </div>

            <!-- Order Summary Section -->
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="order-items">
                    <!-- Dynamic items will be added here -->
                    <div class="text-center py-3">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading order...</span>
                        </div>
                    </div>
                </div>

                <!-- Order Summary Template -->
                <template id="order-item-template">
                    <div class="order-item">
                        <div class="order-item-details">
                            <img src="" alt="" class="order-item-image">
                            <div>
                                <div class="product-name"></div>
                                <div class="product-price"></div>
                            </div>
                        </div>
                        <div class="total-price"></div>
                    </div>
                </template>

                <div class="order-total">
                    <span>Total</span>
                    <span class="total-amount">₱0.00</span>
                </div>
            </div>
        </div>

        <!-- Confirm Order Button -->
        <div class="confirm-order-section">
            <a href="payment.html" class="payment-btn-link">
                <button class="confirm-order-btn" type="button">Confirm Order</button>
            </a>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Component Loader and Main Script -->
    <script type="module">
        import { loadHeader, loadFooter } from '../js/utils/componentLoader.js';
        import '../js/main.js';
        
        loadHeader();
        loadFooter();
    </script>
</body>
</html>
