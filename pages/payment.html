<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Complete your payment at Critter Craft Co">
    <title>Payment - Critter Craft Co.</title>

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lily+Script+One&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/layout.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Header Container -->
    <div id="header-container"></div>

    <!-- Payment Page Content -->
    <main class="payment-page">
        <h1>Payment</h1>
        <div class="payment-container">
            <!-- Payment Methods Section -->
            <div class="payment-methods">
                <h2>QR and E-wallets</h2>
                <a href="https://www.maya.ph/" target="_blank" rel="noopener noreferrer" class="method-option" aria-label="Pay with Maya">
                    MAYA
                </a>
                <div class="or">OR</div>
                <a href="https://www.gcash.com/" target="_blank" rel="noopener noreferrer" class="method-option" aria-label="Pay with GCash">
                    GCASH
                </a>
            </div>

            <!-- Order Summary Section -->
            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="summary-items">
                    <!-- Dynamic order items will go here -->
                    <div class="text-center py-3">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading summary...</span>
                        </div>
                    </div>
                </div>

                <!-- Template for Order Summary Items -->
                <template id="summary-item-template">
                    <div class="summary-item">
                        <span class="item-name"></span>
                        <span class="item-quantity"></span>
                        <span class="item-total"></span>
                    </div>
                </template>

                <div class="summary-total">
                    <span>Total Amount</span>
                    <span class="total-amount">₱0.00</span>
                </div>
            </div>
        </div>

        <!-- Pay Now Button -->
        <div class="pay-now-section">
            <button id="pay-now-btn" class="pay-now-btn" type="button">Pay Now</button>
        </div>
    </main>

    <!-- Footer Container -->
    <div id="footer-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Component Loader and Main Script -->
    <script type="module">
        import { loadHeader, loadFooter } from '../js/utils/componentLoader.js';
        import '../js/main.js';
        
        loadHeader();
        loadFooter();
    </script>
</body>
</html>
